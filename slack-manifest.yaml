display_information:
  name: Slack AI Agent Starter
features:
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Slack AI Agent
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - im:history
settings:
  event_subscriptions:
    request_url: https://YOUR-SERVICE.up.railway.app/slack/events
    bot_events:
      - app_mention
      - message.im
  socket_mode_enabled: false
